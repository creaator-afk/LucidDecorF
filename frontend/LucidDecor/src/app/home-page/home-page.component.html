<!-- Home Page styled with subtle white and blue accent theme -->
<div class="flex flex-col items-center justify-center min-h-[40vh] w-full bg-white py-12">
  <div class="flex flex-col items-center w-full max-w-xl relative z-10">
    <p class="text-3xl md:text-4xl font-bold text-gray-800 text-center mb-6">Welcome to LucidDecor</p>
    <div class="flex flex-col md:flex-row gap-4 w-full justify-center mb-4">
      <button (click)="navigateTo('view-featured-services')" class="px-6 py-3 rounded-md bg-blue-500 text-white font-semibold shadow hover:bg-blue-600 transition text-center">View Featured Services</button>
      <button (click)="navigateTo('search-for-services')" class="px-6 py-3 rounded-md bg-blue-100 text-blue-700 font-semibold shadow hover:bg-blue-200 transition text-center">Search for Services</button>
      <button (click)="navigateTo('login-register')" class="px-6 py-3 rounded-md bg-blue-500 text-white font-semibold shadow hover:bg-blue-600 transition text-center">Login / Register</button>
    </div>
    <input class="w-full md:w-2/3 px-6 py-3 rounded-md text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-blue-400 shadow mb-4 border border-blue-100 bg-blue-50" placeholder="Search for the services . . . . ">
  </div>
</div>
<main class="w-full max-w-5xl mx-auto mt-8 space-y-8">
  <div class="bg-white rounded-xl shadow-md p-8">
    <app-view-featured-services></app-view-featured-services>
  </div>
</main>
