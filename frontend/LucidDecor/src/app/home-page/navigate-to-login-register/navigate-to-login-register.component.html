<h2>Contact Us</h2>
<div>
  <h3>Login</h3>
  <form (ngSubmit)="onLogin()" style="display: flex; flex-direction: column; gap: 1rem;width: 50%; margin-left: 2.5em; margin-right: 2.5em">
    <label for="login-username">Username:</label>
    <input type="text" id="login-username" [(ngModel)]="loginData.username" name="loginUsername" required />
    <label for="login-password">Password:</label>
    <input type="password" id="login-password" [(ngModel)]="loginData.password" name="loginPassword" required />
    <button type="submit">Login</button>
  </form>
</div>
<div>
  <h3>Register</h3>
  <form (ngSubmit)="onRegister()" style="display: flex; flex-direction: column; gap: 1rem;width: 50%; margin-left: 2.5em; margin-right: 2.5em">
    <label for="register-username">Username:</label>
    <input type="text" id="register-username" [(ngModel)]="registerData.username" name="registerUsername" required />
    <label for="register-password">Password:</label>
    <input type="password" id="register-password" [(ngModel)]="registerData.password" name="registerPassword" required />
    <label for="register-email">Email:</label>
    <input type="email" id="register-email" [(ngModel)]="registerData.email" name="registerEmail" required />
    <button type="submit">Register</button>
  </form>
</div>
