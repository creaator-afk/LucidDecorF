<h2>Featured Services</h2>
<div style="display: flex; flex-direction: column; align-items: center" *ngIf="services && services.length; else noServices">
  <div *ngFor="let service of services" class="service-card" [ngClass]="{'column': service.id % 2 === 0, 'column-reverse': service.id % 2 !== 0}"
       style="display: flex; justify-content: space-between;width: 80%">
    <img height="450px" width="650px" [src]="service.image" [alt]="service.name"/>
    <div style="display: flex; justify-content: center;width: 100%; align-content: start; margin-left: 2.5em; flex-direction: column">
      <h3>{{ service.name }}</h3>
      <p>{{ service.description }}</p>
      <p><strong>Price:</strong> {{ service.price | currency }}</p>
      <button class="p-2 bg-blue-500 text-white rounded w-fit" (click)="bookService(service.id)">Book Now</button>
    </div>
  </div>
</div>
<ng-template #noServices>
  <p>No featured services available at the moment.</p>
</ng-template>
