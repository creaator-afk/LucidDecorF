<!-- Search Bar Row Modularized -->
<div class="flex flex-row items-center justify-center gap-4 w-full max-w-7xl mx-auto mt-8 mb-8">
  <!-- Destination Dropdown -->
  <div class="relative w-1/5 flex flex-col items-start">
    <label class="mb-1 ml-1 text-sm font-semibold text-gray-700">Destination</label>
    <button class="w-full px-4 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-400 flex items-center justify-between">
      <span class="text-gray-400">Select destination</span>
      <svg class="w-4 h-4 ml-2 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
    </button>
  </div>
  <!-- Duration Dropdown -->
  <div class="relative w-1/5 flex flex-col items-start">
    <label class="mb-1 ml-1 text-sm font-semibold text-gray-700">Duration</label>
    <button class="w-full px-4 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-400 flex items-center justify-between">
      <span class="text-gray-400">Select duration</span>
      <svg class="w-4 h-4 ml-2 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
    </button>
  </div>
  <!-- People Dropdown -->
  <div class="relative w-1/5 flex flex-col items-start">
    <label class="mb-1 ml-1 text-sm font-semibold text-gray-700">People</label>
    <button class="w-full px-4 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-400 flex items-center justify-between">
      <span class="text-gray-400">Select people</span>
      <svg class="w-4 h-4 ml-2 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
    </button>
  </div>
  <!-- Time Dropdown -->
  <div class="relative w-1/5 flex flex-col items-start">
    <label class="mb-1 ml-1 text-sm font-semibold text-gray-700">Time</label>
    <button class="w-full px-4 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-400 flex items-center justify-between">
      <span class="text-gray-400">Select time</span>
      <svg class="w-4 h-4 ml-2 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
    </button>
  </div>
  <!-- Search Button -->
  <div class="w-1/5 flex flex-col items-start">
    <label class="mb-1 ml-1 text-sm font-semibold text-gray-700 invisible">Search</label>
    <button class="w-full px-6 py-2 bg-blue-600 text-white font-semibold rounded-md shadow hover:bg-blue-700 transition">Search</button>
  </div>
</div>
