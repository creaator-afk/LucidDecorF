<div class="w-full bg-white py-8">
  <div class="max-w-4xl mx-auto px-2 md:px-8">
    <div *ngIf="selectedService" class="flex flex-col md:flex-row gap-8 items-center bg-white rounded-xl shadow p-6 mb-8">
      <img [src]="selectedService.image" alt="{{ selectedService.name }}" class="w-full md:w-64 h-48 object-cover rounded-lg shadow" />
      <div class="flex-1">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ selectedService.name }}</h2>
        <p class="text-gray-600 mb-2">{{ selectedService.description }}</p>
        <p class="text-blue-600 font-semibold mb-2">Price: {{ selectedService.price | currency }}</p>
      </div>
    </div>
    <form [formGroup]="bookServiceForm" (ngSubmit)="onSubmit()" class="bg-white rounded-xl shadow p-6 flex flex-col gap-4">
      <div class="form-group w-full">
        <label for="date" class="block mb-1 font-medium text-gray-700">Select Date:</label>
        <input id="date" type="date" formControlName="date" class="form-control w-full border border-blue-100 rounded-md px-4 py-2 bg-blue-50 focus:border-blue-400 focus:outline-none" />
      </div>
      <button (click)="confirmBooking(selectedService.id)" type="submit" class="w-full md:w-auto px-6 py-2 bg-blue-500 text-white rounded-md font-semibold shadow hover:bg-blue-600 transition" [disabled]="bookServiceForm.invalid">Book my Service</button>
    </form>
  </div>
</div>
