<div class="max-w-2xl mx-auto mt-8">
  <h2 class="text-2xl font-bold mb-4 text-center">Available Services</h2>
  <ul class="space-y-4">
    <li *ngFor="let service of services" class="flex flex-col md:flex-row md:items-center justify-between bg-white rounded-lg shadow p-4">
      <div>
        <div class="font-semibold text-lg">{{ service.name }}</div>
        <div class="text-gray-500 mb-1">{{ service.description }}</div>
        <div class="text-pink-600 font-bold">${{ service.price }}</div>
      </div>
      <button (click)="selectService(service)" class="mt-2 md:mt-0 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition text-center">Select</button>
    </li>
  </ul>
</div>
